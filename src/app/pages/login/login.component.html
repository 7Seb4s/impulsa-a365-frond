<div class="page-wrapper">

  <!-- ===== HEADER / LOGO ===== -->
  <header class="site-header">
    <div class="logo-block">
      <span class="logo-a">A</span><span class="logo-365">365</span><sup class="logo-reg">®</sup>
    </div>
    <p class="logo-sub">Asistencia &middot; Logística &middot; Contact Center</p>
  </header>

  <!-- ===== TARJETA LOGIN ===== -->
  <main class="card-container">
    <div class="login-card">

      <!-- Panel izquierdo decorativo -->
      <div class="left-panel">
        <div class="left-content">
          <div class="icon-grid">
            <div class="icon-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" width="26" height="26">
                <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
              </svg>
            </div>
            <div class="icon-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" width="26" height="26">
                <path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/>
              </svg>
            </div>
            <div class="icon-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" width="26" height="26">
                <path d="M15 5v2M15 11v2M15 17v2M5 5h14a2 2 0 012 2v3a2 2 0 000 4v3a2 2 0 01-2 2H5a2 2 0 01-2-2v-3a2 2 0 000-4V7a2 2 0 012-2z"/>
              </svg>
            </div>
            <div class="icon-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" width="26" height="26">
                <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
              </svg>
            </div>
            <div class="icon-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" width="26" height="26">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
              </svg>
            </div>
            <div class="icon-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" width="26" height="26">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
            </div>
          </div>
          <p class="left-brand">IMPULSA A365</p>
          <p class="left-tagline">Sistema interno de gestión</p>
        </div>
      </div>

      <!-- Panel derecho: formulario -->
      <div class="right-panel">
        <h1 class="form-title">BIENVENIDO</h1>
        <p class="form-subtitle">Por favor, ingresa tu código y contraseña</p>

        <!-- Banner de error -->
        <div class="error-banner" *ngIf="errorMsg">
          <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          {{ errorMsg }}
        </div>

        <form (ngSubmit)="onLogin()" #loginForm="ngForm" novalidate>

          <!-- Código -->
          <div class="form-group">
            <label for="codigo">Código</label>
            <input
              id="codigo"
              type="text"
              name="codigo"
              [(ngModel)]="codigo"
              placeholder="Ingresa tu código"
              autocomplete="username"
              [class.is-error]="errorMsg"
            />
          </div>

          <!-- Contraseña -->
          <div class="form-group">
            <label for="contrasena">Contraseña</label>
            <div class="password-wrap">
              <input
                id="contrasena"
                [type]="mostrarContrasena ? 'text' : 'password'"
                name="contrasena"
                [(ngModel)]="contrasena"
                placeholder="••••••••••"
                autocomplete="current-password"
                [class.is-error]="errorMsg"
              />
              <button type="button" class="toggle-eye" (click)="toggleContrasena()" tabindex="-1">
                <svg *ngIf="!mostrarContrasena" viewBox="0 0 20 20" fill="currentColor" width="17" height="17">
                  <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                  <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                </svg>
                <svg *ngIf="mostrarContrasena" viewBox="0 0 20 20" fill="currentColor" width="17" height="17">
                  <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd"/>
                  <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.064 7 9.542 7 .847 0 1.669-.105 2.454-.303z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Opciones -->
          <div class="form-options">
            <label class="check-label">
              <input type="checkbox" name="recuerdame" [(ngModel)]="recuerdame" />
              <span>Recuérdame</span>
            </label>
            <button type="button" class="link-btn" (click)="onOlvidaste()">
              ¿Olvidaste la contraseña?
            </button>
          </div>

          <!-- Botón -->
          <button type="submit" class="btn-ingresar" [disabled]="cargando">
            <ng-container *ngIf="!cargando">Ingresar</ng-container>
            <ng-container *ngIf="cargando">
              <span class="spinner"></span> Verificando...
            </ng-container>
          </button>

        </form>
      </div>

    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <span>© 2026 Impulsa A365 Todos los derechos reservados por Group16</span>
    <div class="footer-socials">
      <a href="#" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" width="17" height="17">
          <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/>
          <circle cx="4" cy="4" r="2"/>
        </svg>
      </a>
      <a href="#" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor" width="17" height="17">
          <path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/>
        </svg>
      </a>
      <a href="#" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </div>
  </footer>

</div>
