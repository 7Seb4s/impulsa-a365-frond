<div class="login-wrapper">

  <!-- HEADER -->
  <header class="login-header">
    <img src="assets/logo-a365.jpg" alt="A365" class="logo-img" />
  </header>

  <!-- CONTENIDO -->
  <main class="login-main">
    <div class="login-card">

      <!-- Imagen izquierda -->
      <div class="login-image">
        <img src="assets/login-bg.webp" alt="A365 tecnología" />
      </div>

      <!-- Formulario -->
      <div class="login-form-section">
        <h1 class="login-title">BIENVENIDO</h1>
        <p class="login-subtitle">Por favor, ingresa tu código y contraseña</p>

        <!-- Error general (red caída, error inesperado) -->
        <div class="error-banner" *ngIf="errorGeneral">
          <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          {{ errorGeneral }}
        </div>

        <form (ngSubmit)="onLogin()" #loginForm="ngForm" novalidate>

          <!-- Código -->
          <div class="form-group">
            <label for="codigo">Código</label>
            <input
              id="codigo"
              type="text"
              name="codigo"
              [(ngModel)]="codigo"
              placeholder="Ingresa tu código"
              autocomplete="username"
              [class.is-error]="errorCodigo"
            />
            <!-- Error específico del campo código -->
            <span class="field-error" *ngIf="errorCodigo">{{ errorCodigo }}</span>
          </div>

          <!-- Contraseña -->
          <div class="form-group">
            <label for="contrasena">Contraseña</label>
            <div class="password-wrap">
              <input
                id="contrasena"
                [type]="mostrarContrasena ? 'text' : 'password'"
                name="contrasena"
                [(ngModel)]="contrasena"
                placeholder="••••••••••"
                autocomplete="current-password"
                [class.is-error]="errorContrasena"
              />
              <button type="button" class="toggle-eye" (click)="toggleContrasena()" tabindex="-1">
                <svg *ngIf="!mostrarContrasena" viewBox="0 0 20 20" fill="currentColor" width="17" height="17">
                  <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                  <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                </svg>
                <svg *ngIf="mostrarContrasena" viewBox="0 0 20 20" fill="currentColor" width="17" height="17">
                  <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 0 0-5.478-5.478z" clip-rule="evenodd"/>
                  <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.064 7 9.542 7 .847 0 1.669-.105 2.454-.303z"/>
                </svg>
              </button>
            </div>
            <!-- Error específico del campo contraseña -->
            <span class="field-error" *ngIf="errorContrasena">{{ errorContrasena }}</span>
          </div>

          <!-- Opciones -->
          <div class="form-options">
            <label class="check-label">
              <input type="checkbox" name="recuerdame" [(ngModel)]="recuerdame" />
              <span>Recuérdame</span>
            </label>
            <button type="button" class="forgot-link" (click)="onOlvidaste()">
              ¿Olvidaste la contraseña?
            </button>
          </div>

          <!-- Botón -->
          <button type="submit" class="btn-ingresar" [disabled]="cargando">
            <ng-container *ngIf="!cargando">Ingresar</ng-container>
            <ng-container *ngIf="cargando">
              <span class="spinner"></span> Verificando...
            </ng-container>
          </button>

        </form>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="login-footer">
    <span>© 2026 Impulsa A365 Todos los derechos reservados por Group16</span>
    <div class="footer-social">
      <a href="#" class="social-icon" aria-label="LinkedIn">in</a>
      <a href="#" class="social-icon" aria-label="Facebook">f</a>
      <a href="#" class="social-icon" aria-label="Instagram">@</a>
    </div>
  </footer>

</div>
