<div class="app-layout">

  <div class="app-body">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="assets/logo-a365.jpg" alt="A365" class="sidebar-logo" loading="lazy" />
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" routerLink="/dashboard/agente">Inicio</a>
        <a class="nav-item" routerLink="/dashboard/tickets">Tickets</a>
        <a class="nav-item active">Incidencias</a>
        <a class="nav-item" routerLink="/dashboard/reportes">Reportes</a>
      </nav>
      <div class="sidebar-spacer"></div>
      <nav class="sidebar-nav">
        <a class="nav-item" routerLink="/dashboard/perfil">Perfil</a>
        <a class="nav-item" routerLink="/dashboard/configuracion">Configuración</a>
      </nav>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <div class="main-area">

      <header class="topbar">
        <div class="topbar-right">
          <div class="user-chip">
            <div class="user-text">
              <span class="user-name">{{ usuario?.nombre || usuario?.codigo }}</span>
              <span class="user-code">{{ usuario?.codigo }}</span>
            </div>
            <div class="user-avatar">
              <img *ngIf="fotoUrl" [src]="fotoUrl" alt="avatar"
                   style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />
              <svg *ngIf="!fotoUrl" viewBox="0 0 24 24" fill="#9aaac5" width="26" height="26">
                <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
              </svg>
            </div>
          </div>
          <button class="btn-logout-top" (click)="onLogout()">Cerrar sesión</button>
        </div>
      </header>

      <div class="content">

        <!-- VISTA LISTA -->
        <ng-container *ngIf="!mostrarFormulario">

          <div class="page-header">
            <div class="page-title-row">
              <span class="page-icon">&#9993;</span>
              <h2 class="page-title">Incidencias</h2>
            </div>
          </div>

          <div class="panel">
            <h3 class="panel-subtitle">Incidencias reportadas</h3>

            <div class="incidencias-list">
              <div class="incidencia-card" *ngFor="let item of incidencias"
                   [class.resaltado]="item.resaltado">
                <div class="incidencia-info">
                  <p class="incidencia-tipo">Tipo: {{ item.tipo }}</p>
                  <p class="incidencia-tema">{{ item.tema }}</p>
                </div>
                <button class="btn-revisar" [class.naranja]="item.resaltado"
                        (click)="revisar(item)">
                  Revisar
                </button>
              </div>
            </div>

            <div class="panel-footer">
              <button class="btn-nueva" (click)="abrirFormulario()">Nueva incidencia</button>
            </div>
          </div>

        </ng-container>

        <!-- VISTA FORMULARIO -->
        <ng-container *ngIf="mostrarFormulario">

          <div class="page-header form-header">
            <button class="btn-back" (click)="cerrarFormulario()">&#8249;</button>
            <h2 class="page-title">Nueva incidencia</h2>
          </div>

          <div class="panel form-panel">
            <div class="form-group">
              <label class="form-label">Asunto <span class="required">*</span></label>
              <input class="form-input" type="text" [(ngModel)]="formulario.asunto" />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Tipo <span class="required">*</span></label>
                <div class="select-wrapper">
                  <select class="form-select" [(ngModel)]="formulario.tipo">
                    <option value="">Seleccionar...</option>
                    <option value="ACTUALIZACION">Actualización</option>
                    <option value="ELIMINACION">Eliminación</option>
                    <option value="CONSULTA">Consulta</option>
                    <option value="ERROR">Error</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Código del ticket</label>
                <input class="form-input" type="number" [(ngModel)]="formulario.numeroTicket" placeholder="Ej: 12345" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Contenido <span class="required">*</span></label>
              <textarea class="form-textarea" [(ngModel)]="formulario.contenido" rows="8"></textarea>
              <div class="textarea-toolbar">
                <span class="toolbar-icon">T</span>
                <span class="toolbar-icon">&#x1F4CE;</span>
                <span class="toolbar-icon">&#x1F60A;</span>
                <span class="toolbar-icon">&#x1F4CA;</span>
                <span class="toolbar-icon">&#x1F517;</span>
              </div>
            </div>

            <div class="form-footer">
              <button class="btn-enviar" (click)="enviarFormulario()">Enviar</button>
            </div>
          </div>

        </ng-container>

      </div>
    </div>
  </div>

  <footer class="inner-footer">
    <span>&#169; 2026 Impulsa A365 Todos los derechos reservados por Group16</span>
    <div class="footer-icons">
      <a href="#" class="footer-icon">in</a>
      <a href="#" class="footer-icon">f</a>
      <a href="#" class="footer-icon">&#9679;</a>
    </div>
  </footer>

</div>
