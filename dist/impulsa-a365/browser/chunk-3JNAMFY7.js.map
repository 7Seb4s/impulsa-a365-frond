<!-- pages/restablecer/restablecer.component.html -->
<div class="recover-wrapper">

  <!-- HEADER -->
  <header class="recover-header">
    <img src="assets/logo-a365.jpg" alt="A365" class="logo-img" />
  </header>

  <!-- BARRA AZUL -->
  <div class="blue-bar"></div>

  <!-- CONTENIDO -->
  <main class="recover-main">
    <div class="recover-card">

      <h1 class="recover-title">RESTABLECE TU CONTRASEÑA</h1>
      <p class="recover-subtitle">Por favor, ingresa tu nueva contraseña</p>

      <!-- Nueva contraseña -->
      <div class="form-group">
        <label for="nuevaPassword">Nueva contraseña</label>
        <div class="input-wrapper">
          <input
            id="nuevaPassword"
            [type]="mostrarNueva ? 'text' : 'password'"
            name="nuevaPassword"
            [(ngModel)]="nuevaPassword"
            placeholder="Ingresa tu nueva contraseña"
            [class.is-error]="errorMsg"
            autocomplete="new-password"
          />
          <button type="button" class="toggle-eye" (click)="toggleNueva()" tabindex="-1">
            <!-- Ojo abierto -->
            <svg *ngIf="!mostrarNueva" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Ojo tachado -->
            <svg *ngIf="mostrarNueva" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirmar contraseña -->
      <div class="form-group">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <div class="input-wrapper">
          <input
            id="confirmarPassword"
            [type]="mostrarConfirmar ? 'text' : 'password'"
            name="confirmarPassword"
            [(ngModel)]="confirmarPassword"
            placeholder="Confirma tu contraseña"
            [class.is-error]="errorMsg"
            autocomplete="new-password"
          />
          <button type="button" class="toggle-eye" (click)="toggleConfirmar()" tabindex="-1">
            <svg *ngIf="!mostrarConfirmar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="mostrarConfirmar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mensajes de error / éxito -->
      <div class="error-banner" *ngIf="errorMsg">{{ errorMsg }}</div>
      <div class="success-banner" *ngIf="successMsg">{{ successMsg }}</div>

      <!-- Botón restablecer -->
      <div class="btn-center">
        <button class="btn-primary" (click)="restablecer()" [disabled]="cargando">
          <span class="spinner" *ngIf="cargando"></span>
          <span *ngIf="!cargando">Restablecer</span>
        </button>
      </div>

      <!-- Volver al login -->
      <div class="back-login">
        <span>¿Recuerdas tu contraseña? </span>
        <a (click)="volverLogin()" class="link">Inicia sesión</a>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="recover-footer">
    <span>© 2026 Impulsa A365 Todos los derechos reservados por Group16</span>
    <div class="footer-social">
      <a href="#" class="social-icon" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15">
          <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/>
          <circle cx="4" cy="4" r="2"/>
        </svg>
      </a>
      <a href="#" class="social-icon" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15">
          <path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/>
        </svg>
      </a>
      <a href="#" class="social-icon" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </div>
  </footer>

</div>
